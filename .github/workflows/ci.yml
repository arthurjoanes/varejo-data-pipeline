name: Verificação local Spark e Delta

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/browser/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Instalar ferramentas fixadas e Chromium
        run: |
          npm ci --prefix tools/browser
          tools/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Renderizar fixtures sem Spark e verificar estados representativos
        run: |
          node scripts/test_sales_slice.cjs
          PYTHONPATH=src python3 scripts/render_report_fixtures.py tests/fixtures/reports artifacts/browser/html
          DASHBOARD_INPUTS=tests/fixtures/reports DASHBOARD_CASES=historical-demo30k-report,historical-blocked-report,fixture-no-publication,actual-comparable node scripts/dashboard-review.cjs after artifacts/browser/html artifacts/browser/qa
      - name: Preservar recibos do navegador
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-checks
          path: artifacts/browser
          if-no-files-found: ignore
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir runtime fixado e executar smoke real
        run: sh scripts/pipeline.sh setup
      - name: Lint, formato e tipos
        run: sh scripts/pipeline.sh check
      - name: Permissões do relatório em container de teste isolado
        run: python3 scripts/check_report_permissions.py
      - name: Regras e integração real (inclui recuperação)
        run: sh scripts/pipeline.sh test -q --junitxml=/app/artifacts/tests.xml
      - name: Inventário de vulnerabilidades OS, JVM e Python
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ runner.temp }}/trivy-cache:/root/.cache/" \
            -v "$PWD/artifacts:/out" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --scanners vuln --ignorefile /dev/null --format json \
            --output /out/security-scan.json pf-varejo-data:local
      - name: Bloquear todos os achados HIGH e CRITICAL
        run: python3 scripts/check_image_scan.py artifacts/security-scan.json
      - name: Preservar resultado de testes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-result
          path: |
            artifacts/tests.xml
            artifacts/security-scan.json
          if-no-files-found: ignore
      - name: Encerrar recursos desta execução
        if: always()
        run: docker compose --profile report down
